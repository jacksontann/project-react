<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06070A" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Lumen Residences resident portal. Sign in or create your resident account."
    />
    <meta property="og:title" content="Lumen · Resident access" />
    <meta property="og:description" content="Every home begins with a light on." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Critical fonts (Latin subsets, SIL Open Font License, from Fontsource) are preloaded so they
      download in parallel with the JS bundle instead of being discovered after it. The headline
      font is the page's Largest Contentful Paint.
    -->
    <link
      rel="preload"
      href="%PUBLIC_URL%/fonts/instrument-serif-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%PUBLIC_URL%/fonts/instrument-serif-latin-400-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%PUBLIC_URL%/fonts/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Geist Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('%PUBLIC_URL%/fonts/geist-latin-wght-normal.woff2') format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: normal;
        font-display: swap;
        font-weight: 400;
        src: url('%PUBLIC_URL%/fonts/instrument-serif-latin-400-normal.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        font-display: swap;
        font-weight: 400;
        src: url('%PUBLIC_URL%/fonts/instrument-serif-latin-400-italic.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>

    <title>Lumen · Resident access</title>
  </head>
  <body>
    <noscript>Lumen needs JavaScript to switch the lights on.</noscript>
    <div id="root"></div>
  </body>
</html>
